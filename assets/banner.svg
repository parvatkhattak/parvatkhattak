<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Parvat Khattak — Data Scientist · Software Engineer · AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 54px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
      .role  { font: 500 22px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); letter-spacing: 1px; }
      .sub   { font: 400 16px 'Fira Code', 'JetBrains Mono', Consolas, monospace; fill: #94a3b8; }
      .edge  { stroke: #818cf8; stroke-opacity: 0.35; stroke-width: 1.2; }
      .node  { fill: #38bdf8; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.8s; } .d5 { animation-delay: 2.4s; }
      .flow { stroke-dasharray: 6 10; animation: flow 4s linear infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
      @keyframes flow { to { stroke-dashoffset: -64; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Neural network motif -->
  <g transform="translate(830,40)">
    <g class="edge">
      <line x1="0" y1="40" x2="120" y2="20"/><line x1="0" y1="40" x2="120" y2="110"/><line x1="0" y1="40" x2="120" y2="200"/>
      <line x1="0" y1="130" x2="120" y2="20"/><line x1="0" y1="130" x2="120" y2="110"/><line x1="0" y1="130" x2="120" y2="200"/>
      <line x1="0" y1="220" x2="120" y2="20"/><line x1="0" y1="220" x2="120" y2="110"/><line x1="0" y1="220" x2="120" y2="200"/>
      <line x1="120" y1="20" x2="240" y2="70"/><line x1="120" y1="20" x2="240" y2="170"/>
      <line x1="120" y1="110" x2="240" y2="70"/><line x1="120" y1="110" x2="240" y2="170"/>
      <line x1="120" y1="200" x2="240" y2="70"/><line x1="120" y1="200" x2="240" y2="170"/>
      <line x1="240" y1="70" x2="320" y2="120"/><line x1="240" y1="170" x2="320" y2="120"/>
    </g>
    <g stroke="url(#accent)" stroke-width="2" fill="none" class="flow">
      <path d="M0 130 L120 110 L240 70 L320 120"/>
      <path d="M0 40 L120 200 L240 170 L320 120"/>
    </g>
    <circle class="node pulse d1" cx="0" cy="40" r="7"/>
    <circle class="node pulse d2" cx="0" cy="130" r="7"/>
    <circle class="node pulse d3" cx="0" cy="220" r="7"/>
    <circle class="node pulse d2" cx="120" cy="20" r="7" fill="#818cf8"/>
    <circle class="node pulse d4" cx="120" cy="110" r="7" fill="#818cf8"/>
    <circle class="node pulse d1" cx="120" cy="200" r="7" fill="#818cf8"/>
    <circle class="node pulse d5" cx="240" cy="70" r="7" fill="#a78bfa"/>
    <circle class="node pulse d3" cx="240" cy="170" r="7" fill="#a78bfa"/>
    <circle class="node pulse d4" cx="320" cy="120" r="9" fill="#c084fc"/>
  </g>

  <!-- Text -->
  <text x="70" y="118" class="title">Parvat Khattak</text>
  <rect x="72" y="136" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="182" class="role">Data Scientist · Software Engineer · AI/ML Engineer</text>
  <text x="70" y="226" class="sub">&gt; Data Scientist @ Tredence  |  IIT Palakkad  |  AI/ML &amp; GenAI<tspan class="cursor" fill="#38bdf8"> ▌</tspan></text>
</svg>

